experiment:
  name: phase4_correction_sft_v3
  seed: 20260914
  upload_to_hub: false
model:
  original_base_model: Qwen/Qwen2.5-7B-Instruct
  training_checkpoint: /root/models/phase4_warmstart_v2_merged
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
  new_lora_r: 16
  new_lora_alpha: 32
  new_lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  train_path: ../phase4/data/verified_corrections_v1/warmstart_train.jsonl
  dev_path: ../phase4/data/verified_corrections_v1/warmstart_dev.jsonl
  expected_train_rows: 904
  expected_dev_rows: 100
  max_seq_length: 4096
  train_on_final_assistant_only: true
training:
  epochs: 1
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  learning_rate: 0.00001
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  weight_decay: 0.0
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  logging_steps: 5
  save_strategy: 'no'
output:
  root: ../outputs/phase4_correction_sft_v3
  final_adapter: ../outputs/phase4_correction_sft_v3/final_adapter
  train_report: ../outputs/phase4_correction_sft_v3/train_report.json
