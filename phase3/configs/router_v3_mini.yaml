experiment:
  name: phase3_router_v3_mini
  seed: 271828
  upload_to_hub: false

model:
  original_base_model: Qwen/Qwen2.5-7B-Instruct
  training_checkpoint: Kxck/Self_Correction_v1
  initial_adapter: ../outputs/phase3_decision_only_v1/final_adapter
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
  new_lora_r: 32
  new_lora_alpha: 64
  new_lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_path: data/revised_router/revised_router_train.jsonl
  dev_path: data/revised_router/revised_router_dev.jsonl
  expected_train_rows: 200
  expected_dev_rows: 50
  max_seq_length: 4096
  train_on_final_assistant_only: true
  target_contract: decision_tag_only

training:
  epochs: 1
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  learning_rate: 0.00001
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  weight_decay: 0.0
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  logging_steps: 1
  save_strategy: 'no'

output:
  root: ../outputs/phase3_router_v3_mini
  final_adapter: ../outputs/phase3_router_v3_mini/final_adapter
  train_report: ../outputs/phase3_router_v3_mini/train_report.json
